<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AP-Cosmetics</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="layout">

  <aside class="sidebar">
    <div class="brand">
      <span class="monogram">AP</span>
      <span class="brand-text">AP-Cosmetics</span>
    </div>
    <nav class="side-nav" id="viewTabs">
      <button class="side-link active" data-view="shop"><span class="dot"></span> Shop</button>
      <button class="side-link" data-view="manage"><span class="dot"></span> Manage Products</button>
    </nav>
    <div class="sidebar-foot">Curated makeup &amp; skincare</div>
  </aside>

  <main class="main-area">

    <section id="shopView">
      <div class="intro-strip">
        <div>
          <p class="eyebrow">New Collection</p>
          <h1>Look good.<br>Feel golden.</h1>
        </div>
        <div class="intro-shape"></div>
      </div>

      <div class="toolbar">
        <input type="text" id="searchInput" class="form-control" placeholder="Search for a product...">
        <div class="chip-row" id="categoryChips"></div>
      </div>

      <div class="product-list" id="productGrid"></div>
    </section>

    <section id="manageView" class="d-none">
      <div class="manage-top">
        <div>
          <p class="eyebrow">Inventory</p>
          <h2>Manage Products</h2>
        </div>
        <button class="btn-ap" data-bs-toggle="modal" data-bs-target="#productModal" onclick="openCreateForm()">+ New Product</button>
      </div>
      <div class="manage-grid" id="manageGrid"></div>
    </section>

  </main>
</div>

<div class="modal fade" id="productModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">New Product</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="productForm">
          <input type="hidden" id="productId">
          <div class="mb-2"><label class="form-label">Name</label><input class="form-control" id="fName" required></div>
          <div class="row">
            <div class="col mb-2"><label class="form-label">Category</label><input class="form-control" id="fCategory" required></div>
            <div class="col mb-2"><label class="form-label">Price ($)</label><input type="number" min="0" class="form-control" id="fPrice" required></div>
          </div>
          <div class="mb-2"><label class="form-label">Stock</label><input type="number" min="0" class="form-control" id="fStock"></div>
          <div class="mb-2"><label class="form-label">Image URL</label><input class="form-control" id="fImage"></div>
          <div class="mb-2"><label class="form-label">Description</label><textarea class="form-control" id="fDescription" rows="3"></textarea></div>
          <div id="formError" class="text-danger small"></div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn-ap" onclick="saveProduct()">Save</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="app-toast"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
