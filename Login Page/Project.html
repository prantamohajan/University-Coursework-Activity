<!DOCTYPE html>
<html lang="en">

          <head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>PUAIS Login</title>

                    <style>
                              body {
                                        margin: 0;
                                        padding: 0;
                                        font-family: Arial, sans-serif;
                                        background: linear-gradient(135deg, #4facfe, #00f2fe);
                                        height: 100vh;
                                        display: flex;
                                        justify-content: center;
                                        align-items: center;
                              }

                              .login-box {
                                        background: #fff;
                                        padding: 30px;
                                        border-radius: 12px;
                                        width: 300px;
                                        text-align: center;
                                        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
                              }

                              h1 {
                                        margin-bottom: 10px;
                              }

                              .logo {
                                        width: 80px;
                                        margin-bottom: 20px;
                              }

                              input {
                                        width: 100%;
                                        padding: 10px;
                                        margin: 10px 0;
                                        border: 1px solid #ccc;
                                        border-radius: 6px;
                              }

                              button {
                                        width: 100%;
                                        padding: 10px;
                                        background: #4facfe;
                                        border: none;
                                        color: white;
                                        font-size: 16px;
                                        border-radius: 6px;
                                        cursor: pointer;
                              }

                              button:hover {
                                        background: #00c6ff;
                              }
                    </style>
          </head>

          <body>

                    <div class="login-box">
                              <h1>PUAIS</h1>

                              <!-- Logo (এখানে নিজের logo বসাবে) -->
                              <img src="logo.jpeg" alt="Logo" class="logo">

                              <input type="text" placeholder="Username">
                              <input type="password" placeholder="Password">

                              <button>Login</button>
                    </div>

          </body>

</html>
