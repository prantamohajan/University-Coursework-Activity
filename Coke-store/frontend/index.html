<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Coca-Cola Store</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-dark px-4">
  <span class="navbar-brand fw-bold">Coca-Cola Store</span>
  <ul class="nav nav-pills" id="viewTabs">
    <li class="nav-item"><button class="nav-link active" data-view="shop">Shop</button></li>
    <li class="nav-item"><button class="nav-link" data-view="manage">Manage Products</button></li>
  </ul>
</nav>

<header class="hero text-center">
  <h1>Taste the Feeling</h1>
  <p>Official Coca-Cola drinks & merchandise store</p>
</header>

<main class="container py-4">

  <section id="shopView">
    <div class="row mb-4 g-2">
      <div class="col-md-8">
        <input type="text" id="searchInput" class="form-control" placeholder="Search products...">
      </div>
      <div class="col-md-4">
        <select id="categoryFilter" class="form-select"></select>
      </div>
    </div>
    <div class="row g-4" id="productGrid"></div>
  </section>

  <section id="manageView" class="d-none">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="mb-0">Manage Products</h4>
      <button class="btn btn-coke" data-bs-toggle="modal" data-bs-target="#productModal" onclick="openCreateForm()">+ Add Product</button>
    </div>
    <div class="table-responsive">
      <table class="table align-middle">
        <thead>
          <tr><th></th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr>
        </thead>
        <tbody id="productTableBody"></tbody>
      </table>
    </div>
  </section>

</main>

<!-- Product Modal (Create / Edit) -->
<div class="modal fade" id="productModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Add Product</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="productForm">
          <input type="hidden" id="productId">
          <div class="mb-2"><label class="form-label">Name</label><input class="form-control" id="fName" required></div>
          <div class="row">
            <div class="col mb-2"><label class="form-label">Category</label><input class="form-control" id="fCategory" required></div>
            <div class="col mb-2"><label class="form-label">Price ($)</label><input type="number" min="0" class="form-control" id="fPrice" required></div>
          </div>
          <div class="mb-2"><label class="form-label">Stock</label><input type="number" min="0" class="form-control" id="fStock"></div>
          <div class="mb-2"><label class="form-label">Image URL</label><input class="form-control" id="fImage"></div>
          <div class="mb-2"><label class="form-label">Description</label><textarea class="form-control" id="fDescription" rows="3"></textarea></div>
          <div id="formError" class="text-danger small"></div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-coke" onclick="saveProduct()">Save</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="app-toast"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
